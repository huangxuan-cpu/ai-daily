<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="面向 AI 内容创作者的每日选题情报。">
  <title>AI 日报</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="masthead">
    <p class="kicker">AI Creator Daily</p>
    <h1 id="paper-name">AI 日报</h1>
    <p class="tagline">AI 内容创作者情报 · 每天一个新选题</p>
    <p class="dateline"><span id="edition-date">正在读取今日版…</span> · 每天 12:00 更新</p>
    <p id="edition-note" class="edition-note" hidden></p>
  </header>
  <main id="news" class="grid" aria-live="polite"></main>
  <footer class="colophon">
    <p>内容由 AI 每天自动更新 · 来源见各条链接</p>
  </footer>
  <script src="./app.js"></script>
</body>
</html>
